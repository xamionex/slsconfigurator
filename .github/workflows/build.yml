name: Build

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: Build (linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      # Zig is used for glibc compatibility so the binary runs on SteamOS.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slsconfigurator-linux
          path: target/x86_64-unknown-linux-gnu/release/slsconfigurator

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: slsconfigurator-linux
          path: ./dist

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/slsconfigurator
          generate_release_notes: true
